name: Forge Test

on:
  push:
    branches: [poc/**]
  pull_request:
    branches: [poc/**]

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Run tests (mainnet fork)
        run: FOUNDRY_PROFILE=mainnet forge test --match-contract POC_T02_E2E_HandleExtLiq -vvv
        env:
          FOUNDRY_PROFILE: mainnet
